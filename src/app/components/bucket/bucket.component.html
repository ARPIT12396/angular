<div class="bucket-container">
    <h1>My Bucket</h1>
    <ul class="bucket-list">
        @for (item of (myBucket$ | async); track item.id) {
            <li class="bucket-item">{{item.name}} * {{item.quantity}}</li>
        } @empty {
            <li>No items in bucket</li>
        }
    </ul>

</div>
